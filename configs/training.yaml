training:

  batch_size: 32
  gradient_accumulation_steps: 4

  mixed_precision: fp16

  phase_1:
    epochs: 5
    learning_rate: 0.0001

  phase_2:
    learning_rate: 0.00002
    warmup: true
    gradient_clipping: 1.0

  phase_3:
    learning_rate: 0.000005

  early_stopping:
    patience: 5

  cross_validation:
    enabled: true
    folds: 5

  losses:
    hate: BCE
    sarcasm: BCE
    contrastive: NT-Xent
    target: multi_label_BCE

    weights:
      sarcasm: 0.3
      contrastive: 0.1
      target: 0.2

  logging:
    wandb: true
